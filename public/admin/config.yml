local_backend: true

backend:
  name: github
  repo: istiak227/traideas-astro-decap
  branch: main
  squash_merges: true

publish_mode: editorial_workflow
media_folder: public/assets/images
public_folder: /assets/images

site_url: http://localhost:4321/
display_url: http://localhost:4321/
logo_url: /assets/images/logo.png

# Hybrid CMS approach:
# - Collections below manage content entries and editorial workflow.
# - Page Settings manages basic copy + SEO only.
# - Layout, section structure, grids, animation, button styling, and responsive behavior stay in Astro code.

collections:
  - name: case-studies
    label: Case Studies
    label_singular: Case Study
    folder: src/content/case-studies
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{industry}}"
    sortable_fields: [order, title, industry]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Title, name: title, widget: string }
      - { label: Short Title, name: shortTitle, widget: string }
      - { label: Client, name: client, widget: string }
      - { label: Client Short, name: clientShort, widget: string }
      - { label: Industry, name: industry, widget: select, options: [Government, Healthcare, Education, Energy, NGO, Enterprise] }
      - { label: Location, name: location, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Summary, name: summary, widget: text }
      - { label: Overview, name: overview, widget: text }
      - { label: Duration, name: duration, widget: string, required: false }
      - { label: Tech Stack, name: techStack, widget: list, field: { label: Technology, name: technology, widget: string } }
      - { label: Service Components, name: serviceComponents, widget: list, field: { label: Component, name: component, widget: string } }
      - { label: Challenges, name: challenge, widget: list, field: { label: Challenge, name: challengeItem, widget: string } }
      - { label: Solutions, name: solution, widget: list, field: { label: Solution, name: solutionItem, widget: string } }
      - { label: Screenshots, name: screenshots, widget: list, required: false, field: { label: Screenshot label, name: screenshot, widget: string } }
      - { label: Impact Points, name: impactPoints, widget: list, required: false, field: { label: Point, name: point, widget: string } }
      - label: Impact Stats
        name: impactStats
        widget: list
        required: false
        fields:
          - { label: Value, name: v, widget: string }
          - { label: Suffix, name: s, widget: string, required: false }
          - { label: Title, name: t, widget: string }
          - { label: Description, name: d, widget: text }
      - label: CTA Copy
        name: cta
        widget: object
        fields:
          - { label: Label, name: label, widget: string, default: Discuss a Similar Project }
          - { label: Link, name: href, widget: string, default: /contact }

  - name: blogs
    label: Insights · Blog
    label_singular: Blog Post
    folder: src/content/blogs
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{date}}"
    sortable_fields: [order, title, date, cat]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Title, name: title, widget: string }
      - { label: Category, name: cat, widget: string }
      - { label: Date Label, name: date, widget: string, hint: "Example: Apr 18, 2026" }
      - { label: Read Time, name: read, widget: string, required: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Featured Image, name: image, widget: image }
      - { label: Body, name: body, widget: markdown }

  - name: quick-bites
    label: Insights · Quick Bites
    label_singular: Quick Bite
    folder: src/content/quick-bites
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{kind}}"
    sortable_fields: [order, title, kind, category]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Type, name: kind, widget: select, options: [image, text, code] }
      - { label: Category, name: category, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Pinned, name: pinned, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: text, required: false }
      - { label: Meta, name: meta, widget: string, required: false }
      - { label: Code, name: code, widget: code, required: false }
      - { label: Link, name: href, widget: string, default: "#" }

  - name: resources
    label: Insights · Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [order, title, icon]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Icon, name: icon, widget: select, options: [Roadmap, Architecture, Government, Checklist, Doc, Procurement, Integration, API] }
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Tags
        name: tags
        widget: list
        fields:
          - { label: Style, name: style, widget: select, options: [t-framework, t-internal, t-toolkit, t-pdf, t-external, t-guide] }
          - { label: Label, name: label, widget: string }
      - { label: Meta, name: meta, widget: list, field: { label: Meta item, name: item, widget: string } }
      - { label: Link, name: href, widget: string, default: "#" }

  - name: careers
    label: Careers · Open Positions
    label_singular: Open Position
    folder: src/content/careers
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{role}} · {{type}}"
    sortable_fields: [order, role, type, active]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Active, name: active, widget: boolean, default: true }
      - { label: Role, name: role, widget: string }
      - { label: Location, name: loc, widget: string }
      - { label: Type, name: type, widget: string }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - { label: Apply URL, name: applyUrl, widget: string }
      - { label: Skills, name: skills, widget: list, field: { label: Skill, name: skill, widget: string } }
      - { label: Benefits, name: benefits, widget: list, field: { label: Benefit, name: benefit, widget: string } }
      - { label: Detail, name: detail, widget: text, required: false }

  - name: moments
    label: Traideas · Moments
    label_singular: Moment
    folder: src/content/moments
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{tags}}"
    sortable_fields: [order, title, type]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Title, name: title, widget: string }
      - { label: Media, name: src, widget: image }
      - { label: Type, name: type, widget: select, options: [image, video], default: image }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - { label: Poster, name: poster, widget: image, required: false }
      - { label: Controls, name: controls, widget: boolean, required: false, default: true }

  - name: page-copy
    label: Page Settings
    description: "Edit page copy and SEO only. Layout and behavior stay in Astro code."
    files:
      - label: Home Page
        name: home
        file: src/content/page-copy/home.md
        fields:
          - &seo_field
            label: SEO
            name: seo
            widget: object
            fields:
              - { label: SEO Title, name: title, widget: string, required: false }
              - { label: SEO Description, name: description, widget: text, required: false }
          - &hero_copy_field
            label: Hero Copy
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Accent, name: accent, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: text, required: false }
          - label: Clients Copy
            name: clients
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
          - &section_services
            label: Services Section Copy
            name: servicesSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Industries Section Copy
            name: industries
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Case Studies Section Copy
            name: caseStudiesSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Why Traideas Copy
            name: whyTraideas
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Tech Stack Copy
            name: techStack
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: CTA Copy
            name: cta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Culture Section Copy
            name: culture
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Careers Section Copy
            name: careersSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Card Title, name: cardTitle, widget: string, required: false }
          - label: Blog Section Copy
            name: blogSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }

      - label: Services Page
        name: services
        file: src/content/page-copy/services.md
        fields:
          - *seo_field
          - *hero_copy_field
          - *section_services
          - label: CTA Copy
            name: cta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

      - label: Digital Transformation Service
        name: service-digital-transformation
        file: src/content/page-copy/service-digital-transformation.md
        fields: &service_copy_fields
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Title Lines, name: title, widget: list, min: 2, max: 2, field: { label: Line, name: line, widget: string } }
          - { label: Card Title, name: cardTitle, widget: string }
          - { label: Card Description, name: desc, widget: text }
          - { label: Hero Subtitle, name: subtitle, widget: text }
          - { label: About Lead, name: aboutLead, widget: text }
          - { label: About Body, name: aboutBody, widget: text }
      - label: MVP Development Service
        name: service-mvp-development
        file: src/content/page-copy/service-mvp-development.md
        fields: *service_copy_fields
      - label: AI Automation Service
        name: service-ai-automation
        file: src/content/page-copy/service-ai-automation.md
        fields: *service_copy_fields
      - label: Consulting Service
        name: service-consulting
        file: src/content/page-copy/service-consulting.md
        fields: *service_copy_fields

      - label: Case Studies Page
        name: case-studies
        file: src/content/page-copy/case-studies.md
        fields:
          - *seo_field
          - *hero_copy_field
          - label: CTA Copy
            name: cta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

      - label: Insights Page
        name: insights
        file: src/content/page-copy/insights.md
        fields:
          - *seo_field
          - *hero_copy_field
          - label: Section Copy
            name: sections
            widget: object
            fields:
              - label: Blog
                name: blog
                widget: object
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Quick Bites
                name: quick
                widget: object
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
              - label: Resources
                name: resources
                widget: object
                fields:
                  - { label: Eyebrow, name: eyebrow, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
          - label: CTA Copy
            name: cta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

      - label: About Page
        name: about
        file: src/content/page-copy/about.md
        fields:
          - *seo_field
          - *hero_copy_field
          - label: Story Copy
            name: story
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - label: Mindset Intro Copy
            name: mindsetIntro
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Award Copy
            name: award
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }
          - label: Join CTA Copy
            name: joinCta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }

      - label: Moments Page
        name: moments
        file: src/content/page-copy/moments.md
        fields:
          - *seo_field
          - *hero_copy_field
          - label: Gallery Intro Copy
            name: galleryIntro
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Accent, name: accent, widget: string }
              - { label: Description, name: description, widget: text }
          - label: CTA Copy
            name: cta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Accent, name: accent, widget: string, required: false }
              - { label: Description, name: description, widget: text }

      - label: Careers Page
        name: careers
        file: src/content/page-copy/careers.md
        fields:
          - *seo_field
          - *hero_copy_field

      - label: Contact Page
        name: contact
        file: src/content/page-copy/contact.md
        fields:
          - *seo_field
          - *hero_copy_field
          - label: Locations Intro Copy
            name: locationsIntro
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Direct CTA Copy
            name: directCta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
