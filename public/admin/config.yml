local_backend: true

backend:
  name: github
  repo: istiak227/traideas-astro-decap
  branch: main
  squash_merges: true

publish_mode: editorial_workflow
media_folder: public/assets/images
public_folder: /assets/images

site_url: http://localhost:4321/
display_url: http://localhost:4321/
logo_url: /assets/images/logo.png

collections:
  - name: case-studies
    label: Case Studies
    label_singular: Case Study
    folder: src/content/case-studies
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{industry}}"
    sortable_fields: [order, title, industry]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Title, name: title, widget: string }
      - { label: Short Title, name: shortTitle, widget: string }
      - { label: Client, name: client, widget: string }
      - { label: Client Short, name: clientShort, widget: string }
      - { label: Industry, name: industry, widget: select, options: [Government, Healthcare, Education, Energy, NGO, Enterprise] }
      - { label: Location, name: location, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Summary, name: summary, widget: text }
      - { label: Overview, name: overview, widget: text }
      - { label: Duration, name: duration, widget: string, required: false }
      - { label: Tech Stack, name: techStack, widget: list, field: { label: Technology, name: technology, widget: string } }
      - { label: Service Components, name: serviceComponents, widget: list, field: { label: Component, name: component, widget: string } }
      - { label: Challenges, name: challenge, widget: list, field: { label: Challenge, name: challengeItem, widget: string } }
      - { label: Solutions, name: solution, widget: list, field: { label: Solution, name: solutionItem, widget: string } }
      - { label: Screenshots, name: screenshots, widget: list, required: false, field: { label: Screenshot label, name: screenshot, widget: string } }
      - { label: Impact Points, name: impactPoints, widget: list, required: false, field: { label: Point, name: point, widget: string } }
      - label: Impact Stats
        name: impactStats
        widget: list
        required: false
        fields:
          - { label: Value, name: v, widget: string }
          - { label: Suffix, name: s, widget: string, required: false }
          - { label: Title, name: t, widget: string }
          - { label: Description, name: d, widget: text }
      - label: CTA
        name: cta
        widget: object
        fields:
          - { label: Label, name: label, widget: string, default: Discuss a Similar Project }
          - { label: Link, name: href, widget: string, default: /contact }
      - { label: Color Tint, name: colorTint, widget: color, default: "#e6e8f3" }
      - { label: Accent Color, name: accentColor, widget: color, default: "#8D99CE" }

  - name: blogs
    label: Insights · Blog
    label_singular: Blog Post
    folder: src/content/blogs
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{date}}"
    sortable_fields: [order, title, date, cat]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Title, name: title, widget: string }
      - { label: Category, name: cat, widget: string }
      - { label: Date Label, name: date, widget: string, hint: "Example: Apr 18, 2026" }
      - { label: Read Time, name: read, widget: string, required: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Featured Image, name: image, widget: image }
      - { label: Body, name: body, widget: markdown }

  - name: quick-bites
    label: Insights · Quick Bites
    label_singular: Quick Bite
    folder: src/content/quick-bites
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{kind}}"
    sortable_fields: [order, title, kind, category]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Type, name: kind, widget: select, options: [image, text, code] }
      - { label: Category, name: category, widget: string }
      - { label: Title, name: title, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Pinned, name: pinned, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: text, required: false }
      - { label: Meta, name: meta, widget: string, required: false }
      - { label: Code, name: code, widget: code, required: false }
      - { label: Link, name: href, widget: string, default: "#" }

  - name: resources
    label: Insights · Resources
    label_singular: Resource
    folder: src/content/resources
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}}"
    sortable_fields: [order, title, icon]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Icon, name: icon, widget: select, options: [Roadmap, Architecture, Government, Checklist, Doc, Procurement, Integration, API] }
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - label: Tags
        name: tags
        widget: list
        fields:
          - { label: Style, name: style, widget: select, options: [t-framework, t-internal, t-toolkit, t-pdf, t-external, t-guide] }
          - { label: Label, name: label, widget: string }
      - { label: Meta, name: meta, widget: list, field: { label: Meta item, name: item, widget: string } }
      - { label: Link, name: href, widget: string, default: "#" }

  - name: careers
    label: Careers · Open Positions
    label_singular: Open Position
    folder: src/content/careers
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{role}} · {{type}}"
    sortable_fields: [order, role, type, active]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Active, name: active, widget: boolean, default: true }
      - { label: Role, name: role, widget: string }
      - { label: Location, name: loc, widget: string }
      - { label: Type, name: type, widget: string }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - { label: Apply URL, name: applyUrl, widget: string }
      - { label: Skills, name: skills, widget: list, field: { label: Skill, name: skill, widget: string } }
      - { label: Benefits, name: benefits, widget: list, field: { label: Benefit, name: benefit, widget: string } }
      - { label: Detail, name: detail, widget: text, required: false }

  - name: moments
    label: Traideas · Moments
    label_singular: Moment
    folder: src/content/moments
    create: true
    slug: "{{fields.order}}-{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{title}} · {{tags}}"
    sortable_fields: [order, title, type]
    fields:
      - { label: Order, name: order, widget: number, value_type: int, default: 999 }
      - { label: Title, name: title, widget: string }
      - { label: Media, name: src, widget: image }
      - { label: Type, name: type, widget: select, options: [image, video], default: image }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - { label: Display Size, name: size, widget: select, options: [s-large, s-tall, s-small, s-wide], default: s-small }
      - { label: Poster, name: poster, widget: image, required: false }
      - { label: Controls, name: controls, widget: boolean, required: false, default: true }

  - name: site-pages
    label: Page Settings
    files:
      - label: Home Page
        name: home
        file: src/content/pages/home.md
        fields:
          - &seo_field
            label: SEO
            name: seo
            widget: object
            fields:
              - { label: Meta Title, name: title, widget: string, required: false }
              - { label: Meta Description, name: description, widget: text, required: false }
              - { label: Social Image, name: image, widget: image, required: false }
          - &hero_field
            label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Accent, name: accent, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: text, required: false }
              - label: Primary CTA
                name: primaryCta
                widget: object
                required: false
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }]
              - label: Secondary CTA
                name: secondaryCta
                widget: object
                required: false
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }]
              - label: Stats
                name: stats
                widget: list
                required: false
                fields: [{ label: Value, name: value, widget: string, required: false }, { label: Target, name: target, widget: number, required: false }, { label: Suffix, name: suffix, widget: string, required: false }, { label: Label, name: label, widget: string }]
              - label: Images
                name: images
                widget: list
                required: false
                fields: [{ label: Image, name: src, widget: image }, { label: Alt, name: alt, widget: string }]
              - { label: Chips, name: chips, widget: list, required: false, field: { label: Chip, name: chip, widget: string } }
          - label: Clients
            name: clients
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Logos, name: logos, widget: list, field: { label: Logo, name: logo, widget: image } }
          - &section_header_field
            label: Services Section
            name: servicesSection
            widget: object
            fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }]
          - label: Industries
            name: industries
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Items
                name: items
                widget: list
                fields: [{ label: Label, name: label, widget: string }, { label: Subtitle, name: sub, widget: string }, { label: Icon, name: icon, widget: string }]
          - label: Case Studies Section
            name: caseStudiesSection
            widget: object
            fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }]
          - label: Why Traideas
            name: whyTraideas
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Items
                name: items
                widget: list
                fields: [{ label: Number, name: n, widget: string }, { label: Title, name: t, widget: string }, { label: Description, name: d, widget: text }]
          - label: Tech Stack
            name: techStack
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Items
                name: items
                widget: list
                fields: [{ label: Name, name: name, widget: string }, { label: Description, name: desc, widget: string }]
          - &cta_field
            label: CTA
            name: cta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Accent, name: accent, widget: string, required: false }
              - { label: Description, name: description, widget: text }
              - label: Primary
                name: primary
                widget: object
                required: false
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }]
              - label: Secondary
                name: secondary
                widget: object
                required: false
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }]
              - { label: Tagline, name: tagline, widget: string, required: false }
              - { label: Aside Title, name: asideTitle, widget: string, required: false }
              - { label: Items, name: items, widget: list, required: false, field: { label: Item, name: item, widget: string } }
          - label: Culture
            name: culture
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Images
                name: images
                widget: list
                fields: [{ label: Image, name: src, widget: image }, { label: CSS Class, name: cls, widget: string }, { label: Alt, name: alt, widget: string }, { label: Tag, name: tag, widget: string }]
          - label: Careers Section
            name: careersSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: CTA
                name: cta
                widget: object
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }]
              - label: Stats
                name: stats
                widget: list
                fields: [{ label: Value, name: value, widget: string }, { label: Label, name: label, widget: string }]
              - { label: Card Title, name: cardTitle, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Image Alt, name: imageAlt, widget: string }
          - label: Blog Section
            name: blogSection
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Action
                name: action
                widget: object
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }]
      - label: Services Page
        name: services-page
        file: src/content/pages/services.md
        fields:
          - *seo_field
          - *hero_field
          - label: Visual Card
            name: visual
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Code, name: code, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Stats
                name: stats
                widget: list
                fields: [{ label: Value, name: value, widget: string }, { label: Label, name: label, widget: string }]
              - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
              - { label: Bottom Left, name: bottomLeft, widget: string }
              - { label: Bottom Right, name: bottomRight, widget: string }
          - label: Services Section
            name: servicesSection
            widget: object
            fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }]
          - label: Process Steps
            name: processSteps
            widget: list
            fields: [{ label: Title, name: t, widget: string }, { label: Description, name: d, widget: text }]
          - *cta_field
      - label: Digital Transformation Service
        name: service-digital-transformation
        file: src/content/pages/service-digital-transformation.md
        fields: &service_fields
          - { label: Slug, name: slug, widget: string }
          - { label: Number, name: num, widget: string }
          - { label: Icon, name: icon, widget: string }
          - { label: Eyebrow, name: eyebrow, widget: string }
          - { label: Page Title Lines, name: title, widget: list, field: { label: Line, name: line, widget: string } }
          - { label: Card Title, name: cardTitle, widget: string }
          - { label: Card Description, name: desc, widget: text }
          - { label: Subtitle, name: subtitle, widget: text }
          - label: Hero Stats
            name: heroStats
            widget: list
            fields: [{ label: Value, name: v, widget: string }, { label: Label, name: l, widget: string }]
          - { label: Hero Tags, name: heroTags, widget: list, field: { label: Tag, name: tag, widget: string } }
          - { label: Pulse Text, name: pulse, widget: string }
          - { label: About Lead, name: aboutLead, widget: text }
          - { label: About Body, name: aboutBody, widget: text }
          - label: Features
            name: features
            widget: list
            fields: [{ label: Title, name: t, widget: string }, { label: Description, name: d, widget: text }]
          - label: Impact
            name: impact
            widget: list
            fields: [{ label: Value, name: v, widget: string }, { label: Suffix, name: s, widget: string }, { label: Title, name: t, widget: string }, { label: Description, name: d, widget: text }]
          - { label: Components, name: components, widget: list, field: { label: Component, name: component, widget: string } }
          - { label: CTA Includes, name: ctaIncludes, widget: list, field: { label: Item, name: item, widget: string } }
      - label: MVP Development Service
        name: service-mvp-development
        file: src/content/pages/service-mvp-development.md
        fields: *service_fields
      - label: AI Automation Service
        name: service-ai-automation
        file: src/content/pages/service-ai-automation.md
        fields: *service_fields
      - label: Consulting Service
        name: service-consulting
        file: src/content/pages/service-consulting.md
        fields: *service_fields
      - label: Case Studies Page
        name: case-studies-page
        file: src/content/pages/case-studies.md
        fields:
          - *seo_field
          - *hero_field
          - label: Visual Card
            name: visual
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - label: Stats
                name: stats
                widget: list
                fields: [{ label: Value, name: value, widget: string }, { label: Label, name: label, widget: string }]
              - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
              - { label: Bottom Left, name: bottomLeft, widget: string }
              - { label: Bottom Right, name: bottomRight, widget: string }
          - *cta_field
      - label: Insights Page
        name: insights-page
        file: src/content/pages/insights.md
        fields:
          - *seo_field
          - *hero_field
          - label: Categories
            name: categories
            widget: list
            fields: [{ label: Key, name: key, widget: string }, { label: Label, name: label, widget: string }, { label: Meta, name: meta, widget: text }]
          - label: Sections
            name: sections
            widget: object
            fields:
              - { label: Blog, name: blog, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
              - { label: Quick Bites, name: quick, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
              - { label: Resources, name: resources, widget: object, fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }] }
          - *cta_field
      - label: About Page
        name: about-page
        file: src/content/pages/about.md
        fields:
          - *seo_field
          - *hero_field
          - label: Story
            name: story
            widget: object
            fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Image, name: image, widget: image }, { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }]
          - label: Story Stat
            name: storyStat
            widget: object
            fields: [{ label: Value, name: value, widget: string }, { label: Label, name: label, widget: string }]
          - label: Mindset Intro
            name: mindsetIntro
            widget: object
            fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }]
          - label: Pillars
            name: pillars
            widget: list
            fields: [{ label: Number, name: n, widget: string }, { label: Title, name: t, widget: string }, { label: Description, name: d, widget: text }]
          - label: Award
            name: award
            widget: object
            fields: [{ label: Title, name: title, widget: string }, { label: Image, name: image, widget: image }, { label: Paragraphs, name: paragraphs, widget: list, field: { label: Paragraph, name: paragraph, widget: text } }, { label: Meta, name: meta, widget: list, fields: [{ label: Label, name: label, widget: string }, { label: Value, name: value, widget: string }] }]
          - label: Join CTA
            name: joinCta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Primary
                name: primary
                widget: object
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }]
              - label: Secondary
                name: secondary
                widget: object
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }]
              - { label: Aside Title, name: asideTitle, widget: string }
              - { label: Items, name: items, widget: list, field: { label: Item, name: item, widget: string } }
      - label: Moments Page
        name: moments-page
        file: src/content/pages/moments.md
        fields:
          - *seo_field
          - *hero_field
          - label: Gallery Intro
            name: galleryIntro
            widget: object
            fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Accent, name: accent, widget: string }, { label: Description, name: description, widget: text }]
          - *cta_field
      - label: Careers Page
        name: careers
        file: src/content/pages/careers.md
        fields:
          - *seo_field
          - *hero_field
          - label: Reasons
            name: reasons
            widget: list
            fields: [{ label: Number, name: n, widget: string }, { label: Title, name: t, widget: string }, { label: Description, name: d, widget: text }]
          - label: Values
            name: values
            widget: list
            fields: [{ label: Label, name: label, widget: string }, { label: Icon, name: icon, widget: string }]
          - label: Life Images
            name: lifeImages
            widget: list
            fields: [{ label: Image, name: src, widget: image }, { label: Alt, name: alt, widget: string }, { label: CSS Class, name: cls, widget: string }]
      - label: Contact Page
        name: contact-page
        file: src/content/pages/contact.md
        fields:
          - *seo_field
          - *hero_field
          - { label: Calendly URL, name: calendlyUrl, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Working Hours, name: workingHours, widget: string }
          - label: Highlights
            name: highlights
            widget: list
            fields: [{ label: Label, name: label, widget: string }, { label: Icon, name: icon, widget: string }]
          - { label: Calendar Title, name: calendarTitle, widget: string }
          - { label: Calendar Tag, name: calendarTag, widget: string }
          - label: Locations Intro
            name: locationsIntro
            widget: object
            fields: [{ label: Eyebrow, name: eyebrow, widget: string }, { label: Title, name: title, widget: string }, { label: Description, name: description, widget: text }]
          - label: Offices
            name: offices
            widget: list
            fields: [{ label: Title, name: title, widget: string }, { label: Address, name: address, widget: text }, { label: Image, name: image, widget: image }, { label: Tag, name: tag, widget: string }, { label: Map URL, name: mapUrl, widget: string }]
          - label: Direct CTA
            name: directCta
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Actions
                name: actions
                widget: list
                fields: [{ label: Label, name: label, widget: string }, { label: Link, name: href, widget: string }, { label: Style, name: style, widget: select, options: [primary, ghost] }]
              - { label: Aside Title, name: asideTitle, widget: string }
              - { label: Items, name: items, widget: list, field: { label: Item, name: item, widget: string } }
